version: '3.8'
services:
  db:
    image: postgres:13
    ports:
      - "5433:5432"  
    environment:
      POSTGRES_DB: rentacar_db
      POSTGRES_USER: user_web
      POSTGRES_PASSWORD: sifre123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./backend
    command: sh -c "/usr/src/app/wait-for-it.sh db:5432 -- sh /usr/src/app/init.sh"
    volumes:
      - ./backend:/usr/src/app 
    ports:
      - "8000:8000"
    depends_on:
      - db

  react-app:
    build:
      context: ./web_front
      dockerfile: Dockerfile
    ports:
      - "80:80"

volumes:
  postgres_data:
